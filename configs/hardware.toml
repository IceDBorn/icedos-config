[[icedos.repositories]]
url = "github:icedos/hardware"
# overrideUrl = "path:/home/ice/.code/icedos/hardware"
modules = [
  "cachyos-kernel",
  "disable-ipv6",
  "kernel",
  "radeon",
  "ryzen",
]

[icedos.hardware.kernel]
variant = "latest"

[icedos.hardware.kernel.cachyos.substituters]
primary = false
secondary = true

[icedos.hardware.network]
firewall = false

[[icedos.hardware.mounts]]
path = "/mnt/storage"
device = "/dev/sda1"
fsType = "xfs"
flags = ["noatime", "nofail", "x-gvfs-show"]
