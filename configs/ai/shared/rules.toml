[icedos.ai-tools.rules]
git-commits = """
# Git commit policy

Always:

- Never run `git commit` unless the user explicitly asks you to commit.
- Stage changes with `git add` when a task is done, then stop and report what is staged.
- A commit request covers only that one commit, not later changes.
"""

comment-rules = """
# Code comment policy

Always:

- Comments at most 2 lines, single line preferred.
- No multi-line header blocks; no restating what code obviously does.
- Comment only where non-obvious (tricky logic, constraints).
- When editing existing code, trim new comments to the minimum needed.
"""

unslop = """
# Unslop

Edit text to remove AI patterns.

## Process

1. Scan for the patterns below.
2. Rewrite. Preserve meaning, match intended tone.
3. Self-audit: "What makes this obviously AI generated?" Fix remaining tells.

## Patterns to detect and fix

Rule numbers are stable ids that other skills cite. A removed rule leaves a gap.

### Content

3. **Superficial -ing phrases.** "highlighting...", "ensuring...", "reflecting...", "showcasing...", "fostering...". Delete or expand with real sources.
5. **Vague attributions.** "Experts believe", "Industry reports suggest", "Some critics argue". Name the source or delete.

### Language

7. **AI vocabulary.** Additionally, crucial, delve, enduring, enhance, fostering, garner, interplay, intricate, landscape (abstract), pivotal, showcase, tapestry (abstract), testament, underscore, vibrant. Replace with plain words.
8. **Fancy ways to say "is".** "serves as", "stands as", "boasts", "features". Just say "is" or "has".
9. **"Not just X, but Y."** State the point directly instead.
10. **Rule of three.** Forcing ideas into groups of three. Use the natural number.
11. **Synonym cycling.** Protagonist, main character, central figure, hero all in one paragraph. Pick one, repeat it.
12. **False ranges.** "from X to Y" where X and Y aren't on a meaningful scale. List topics directly.

### Style

13. **Em dash overuse.** Avoid em dashes entirely. Use periods or commas only (no parentheses, no en dashes, no hyphen-as-dash substitutes). If a thought needs separation, end the sentence or use a comma.
14. **Colon overuse.** Colons are fine before a list or example. Not as mid-sentence connectors. "If you're coming from traditional automation: instead of registering event handlers, you describe conditions" adds nothing with the colon. Rewrite to let the point stand on its own without comparison framing. "Describing when the scheduler should fire works best as plain English." Same meaning, no crutch punctuation.
15. **Boldface overuse.** Don't bold every proper noun or acronym.
16. **Inline-header lists.** The tell is a bold label and colon that restates the line: "**Performance:** Performance improved...". Convert those to prose. A bold lead-in that ends in a period, names the item, and is followed by genuinely new detail ("**Schema in TypeScript.** Tables live in one file.") is fine, not a tell.
17. **Title case headings.** Use sentence case.
18. **Decorative emojis.** Remove from headings and bullets.
19. **Curly quotes.** Replace with straight quotes.

### Communication artifacts

20. **Chatbot phrases.** "I hope this helps!", "Let me know if...", "Of course!", "Certainly!", "Found the smoking gun!" Remove.
22. **Sycophantic tone.** "Great question! You're absolutely right!" Respond directly.

### Filler

23. **Filler phrases.** "In order to" becomes "To". "Due to the fact that" becomes "Because". "It is important to note that" gets deleted.
24. **Excessive hedging.** "could potentially possibly be argued that it might" becomes "may".
25. **Generic conclusions.** "The future looks bright." State specific plans or facts.

### Jargon

26. **Abstract metaphor nouns.** Substrate, wedge, vector, locus, vantage, nexus, primitive (as noun), harness (as metaphor), surface (as in "API surface"), bedrock, scaffolding (as metaphor), modality, paradigm, gold-plating, ratchet (as metaphor), evacuate (for moving code), endgame, north star, flywheel. These read as technical but usually have a plainer concrete word. "Substrate" becomes "base". "Wedge in" becomes "add". "Vector" becomes "way" or "method". "Gold-plating" becomes "more than the job needs". "Ratchet" becomes the mechanism's real name or "a limit that only tightens". "Evacuate" becomes "move out". "Endgame" becomes "the last phase". Pick the concrete word.

### Plain speech

27. **Say what it does, not how it feels.** "the database stays close at hand", "SQL you can read", "types that follow your schema" name a feeling. The fix names the mechanism or a number: "`.toSQL()` returns the exact string sent to the database", "a column rename fails the build". Ask what the sentence tells the reader to do or know, then write that. If you can't restate it as a concrete instruction, fact, or number, cut it. One more check: if the sentence could appear unchanged in another project's docs, it says nothing about this one. Cut it.
28. **Shorten or split dense sentences.** If the reader has to backtrack to parse a sentence, break it in two or drop clauses. One idea per sentence.
29. **Active voice.** Prefer it. Catch "is/are/was/were + past participle" and name the actor: "queries are validated" becomes "the compiler validates queries", "the file is parsed by the loader" becomes "the loader parses the file". Passive is fine only when the actor is unknown or genuinely doesn't matter.
30. **Cut adverbs, or use a stronger verb.** "runs quickly" becomes "is fast" or the number. "significantly improves" becomes the measured delta. An adverb propping up a weak verb means the verb is wrong.
31. **Prefer the plain word.** "utilize" becomes "use", "leverage" becomes "use", "facilitate" becomes "help", "numerous" becomes "many", "in the event that" becomes "if". The fancier synonym is rarely clearer.
32. **Mannered prose.** Metaphor or flourish where a literal phrase exists: aphorisms ("wire it or delete it"), rhetorical fragments for effect, personified code ("the plan holds it"), figurative verbs ("rides along", "stands on"), stock framing phrases. "A dial worth turning" becomes "a parameter worth varying". Say what you mean. Rule 26 covers the metaphor nouns.
33. **Over-compression.** Dropped articles, verbless fragments, symbol-speak, and abbreviations that make the reader decode instead of read. "Parser rejects bad date → exit 2, no write" becomes "The parser rejects a bad date, exits with code 2, and writes nothing." Write whole sentences with their articles and verbs, and spell out arrows and abbreviations.
"""

clean-leftovers = """
# Leftover cleanup

Always:

- Before finishing a task, delete every leftover you created: temp files, scratch scripts, state or round files, logs, test outputs, backup copies.
- Stop background processes, dev servers and subagent sessions you started.
- Remove debug prints and throwaway code you added.
- Keep only what the user asked for. If unsure whether a file is wanted, ask instead of leaving it.
- Clear Nix store garbage you created. Call the icedos MCP tool `gc_roots` with `under=` set to each dir you worked in, then pass the `result` links and other roots you made to `nix_cleanup`. It unlinks them and deletes their targets unless something still uses them. `collect=true` also drops every unreferenced path.
- Call `build_cleanup` for the paths your `nix_build` runs added to remote hosts, drive stores and the host store.
- Leave roots you did not make alone, such as `.direnv` roots and a project's own `.gcroots`.
- Never delete old generations (`nix-collect-garbage -d`, `--delete-older-than`) unless the user asks.
- Without the icedos MCP, remove the links yourself, then run `nix store delete <path>` or `nix-collect-garbage`.
"""

nix-flake-store-copy = """
# Flakes outside git copy the whole directory

Always:

- A flake in a directory without `.git` is a `path:` flake. Nix copies the entire directory recursively into `/nix/store` on every evaluation where its contents changed.
- That copy includes `node_modules`, build outputs, `result` links, datasets and VM images. Repeated runs can fill the root disk.
- `.gitignore` only filters the copy inside a git repo. Without `.git`, Nix ignores it.
- Inside a git repo Nix copies only tracked files, so new files need `git add` before the flake sees them.
- Before `nix run`, `nix develop`, `nix flake check` or a build on a local flake, call the icedos MCP tool `flake_preflight` with the absolute ref. It reports the copy size, the heavy entries and untracked files, and refuses copies over `storage.maxFlakeCopyMb`. `nix_build` runs it itself.
- If it refuses, run `git init`, add a `.gitignore` and `git add` the needed files, or move the flake into a small subdirectory.
- After such runs, remove the store copies as described in the leftover cleanup rule. `build_cleanup` deletes the source copies of flakes built with `nix_build`.
- Without the icedos MCP, check the size with `du -sh` before running the flake.
"""

dev-plans = """
# Plans are development-only

Always:

- Plan, spec and design files you write (for example under `docs/superpowers/plans/` or `docs/superpowers/specs/`) are working notes for development only.
- Never commit them. Leave them out of `git add`, and unstage them if a broad `git add` picked them up.
- Do not add them to `.gitignore` unless the user asks. Keep them untracked in the working tree.
- If a plan file is already tracked, tell the user instead of removing it from git yourself.
"""

storage-drives = """
# Heavy files and Nix stores go on the secondary drives

Always:

- The root disk (`/`, NVMe, about 2000 MB/s) is small and nearly full. Use it, including the host `/nix/store`, only when the task requires it or needs the fastest disk.
- Put everything else that is large (gigabytes) on a secondary drive. This covers test datasets, VM and disk images, model weights, downloaded archives, build caches, Nix builds and files kept until a plan is implemented.
- Before writing anything large, call the icedos MCP tool `storage_pick` with `need_gb`, the `io` kind and a `project` name. It keeps 30 GB free on every drive, since Steam and games need room to update, and returns a created `<mount>/ai-dump/<project>/`.
- Use `io="random"` (SSD) for Nix builds, compiling, databases, running VM disks and `node_modules`, and `io="sequential"` (HDD) for archives, datasets, backups and files parked until a plan is implemented.
- Keep one task on one drive. Do not split a build or dataset across drives.
- For Nix builds, pass a `need_gb` estimate to `nix_build`. With `store="auto"` it moves large local builds to a store on an SSD and gives the `nix shell --store ...` command to run the output. Drive stores share nothing with the host `/nix/store`, so the first build there downloads its dependencies again.
- Never use a drive store for `nixos-rebuild`, IceDOS rebuilds or anything the system or user profile must reference. Those need the host store.
- Only touch `ai-dump`. Never touch other directories on these drives, such as `games`, `steam`, `videos` or `expunged`.
- When the task or plan that needed the files is done, delete them as described in the leftover cleanup rule. `build_cleanup` deletes your drive store builds, and `storage_status` shows what each `ai-dump` entry holds.
- Without the icedos MCP, run `df -h / /mnt/games-ssd /mnt/games-ssd-2 /mnt/games-hdd` to pick a drive, and pass `--store <mount>/ai-dump/nix-store` to every `nix` command that uses a drive store.
"""

remote-builders = """
# Remote Nix build hosts

Always:

- For a heavy Nix build (compilers, kernels, browsers, VM tests, anything over a few minutes), call the icedos MCP tool `nix_build` with `host="auto"`. It checks this PC's load and every host in `icedos.ai-tools.mcp-server.build.hosts`, and offloads only when this PC is busy. `build_hosts` shows why it picked a host.
- Small builds and evaluations stay local.
- Remote outputs stay in the host's store, because the remote users are not trusted. Inspect them over `ssh`, or copy files back with `scp`.
- Never use remote hosts for `nixos-rebuild` or IceDOS rebuilds. Those need the local store.
- These are other people's PCs. Only touch the Nix store and files you created under `/tmp`.
- Call `build_cleanup` once you are done with the outputs, as described in the leftover cleanup rule.
- Without the icedos MCP, build with `nix build --eval-store auto --store ssh-ng://<host> --no-link --print-out-paths <installable>`. The local `builders` setting does not work, because this user is not in `trusted-users`.
"""
