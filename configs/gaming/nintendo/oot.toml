[[icedos.repositories]]
url = "github:icedos/gaming"
modules = [
  "lichii",
]

[icedos.applications.steam]
extraPackages = ["lichii"]

[[icedos.applications.sunshine-headless.apps]]
name = "The Legend of Zelda - Ocarina of Time"
command = [
  "proton-launch",
  "--no-mangohud",
  "lichii",
  "-f",
  "/mnt/games-hdd/games/nintendo/oot/game.nsp"
]
env = { QT_QPA_PLATFORM = "xcb", WAYLAND_DISPLAY = "" }
