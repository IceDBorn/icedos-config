[[icedos.repositories]]
url = "github:icedos/apps"
modules = [
  "lact",
  "steam-headless",
]

[[icedos.repositories]]
url = "github:icedos/hardware"
modules = [
  "cachyos-kernel",
  "kernel",
  "openrgb",
  "radeon",
  "scx",
  "xpadneo",
  "zenergy",
]

[[icedos.repositories]]
url = "github:icedos/gaming"
# overrideUrl = "path:/home/ice/Projects/icedos/gaming"
modules = [
  "gamescope",
  "kytyps5",
  "mangohud",
  "prefixer",
  "proton-launch",
  "steam-cloud-file-manager",
  "steam-wayland-overlay",
  "tweaks",
  "unshade",
]

[icedos.gaming.mangohud]
fpsLimit = "0,144,60,30"

[icedos.gaming.proton-launch]
presentMode = "immediate"

[icedos.applications.steam]
beta = true
cpuUsageWorkaround = true
downloadsWorkaround = true

[icedos.applications.sunshine-headless.session.controllers]
excludeHost = false

[icedos.applications.sunshine-headless.session.sunshine]
name = "Saloni City"

[icedos.applications.sunshine]
capSysAdmin = true

[icedos.applications.sunshine.settings]
capture = "kms"
sunshine_name = "Saloni Desktop"

[icedos.gaming.unshade]
includeInIcedosGc = true

[icedos.hardware.kernel]
variant = "latest-lto-x86_64-v3"

[icedos.system]
packages = [
  "pcsx2",
  "wl-freeze",
]
