[[icedos.repositories]]
url = "github:icedos/apps"
modules = [
  "nx-optimizer",
]

[icedos.applications.steam]
extraPackages = ["eden"]

[icedos.system]
packages = ["eden"]

[[icedos.applications.sunshine-headless.apps]]
name = "The Legend of Zelda - Tears of the Kingdom"
command = [
  "proton-launch",
  "--no-mangohud",
  "eden",
  "-f",
  "/mnt/games-hdd/games/totk/game.nsp"
]
env = { QT_QPA_PLATFORM = "xcb", WAYLAND_DISPLAY = "" }
