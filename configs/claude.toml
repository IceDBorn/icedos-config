[[icedos.repositories]]
url = "github:icedborn/claude-icedos"
# overrideUrl = "path:/home/ice/.code/icedos/claude-icedos"
modules = ["claude-review-mcp", "climit"]

[home-manager.users.ice.programs.claude-code.settings]
remoteControlAtStartup = false

# claude-icedos dropped its own `enabledPlugins` / `skills` / `mcpServers`
# options in "rework: use upstream home manager solutions", so all three are set
# through the upstream home-manager options below. `enabledPlugins` is an object
# keyed `plugin@marketplace` (the old icedos option took a list and converted).
[home-manager.users.ice.programs.claude-code.settings.enabledPlugins]
"superpowers@claude-plugins-official" = true
"caveman@caveman" = true
# Code intelligence (LSP) plugins from the official marketplace. Each one only
# wires Claude Code's built-in LSP tool to a language server binary that must
# already be on PATH — the plugin never installs it, hence the matching entries
# in `icedos.system.packages` below.
"php-lsp@claude-plugins-official" = true
"pyright-lsp@claude-plugins-official" = true
"rust-analyzer-lsp@claude-plugins-official" = true
"typescript-lsp@claude-plugins-official" = true

# Language server binaries for the LSP plugins above. Lists concatenate across
# config files, so these merge with `icedos.system.packages` in config.toml.
# Binary names the plugins exec: intelephense, pyright-langserver,
# rust-analyzer, typescript-language-server.
[icedos.system]
packages = [
  "intelephense",
  "pyright",
  "rust-analyzer",
  "typescript-language-server",
]

# `source` is a Nix fetcher, not Claude's own git/github marketplace source:
# claude-icedos fetches the marketplace at build time and home-manager records
# the resulting store path as `extraKnownMarketplaces.<name>.source =
# { source = "directory"; path = <store>; }`, so Claude Code reads it from the
# store instead of cloning at runtime. That means rev+hash are pinned here and a
# marketplace update is a manual bump:
#   nix-prefetch-url --unpack https://github.com/<owner>/<repo>/archive/<rev>.tar.gz
[[icedos.applications.claude-code.users.ice.marketplaces]]
name = "claude-plugins-official"
source = "fetchFromGitHub"
owner = "anthropics"
repo = "claude-plugins-official"
rev = "8864c9d619547417e9bd9305df0b4fc078f89b08"
hash = "sha256-c5vpzHdEDNQ47nhOfGp5gy7jE3gB/BoRYBe06lYjsVU="

[[icedos.applications.claude-code.users.ice.marketplaces]]
name = "caveman"
source = "fetchFromGitHub"
owner = "JuliusBrussee"
repo = "caveman"
rev = "766dce6b1394ebb56a3090748d5a0240a5aefb36"
hash = "sha256-NBq3XCbvvw89pHdSKr2z4KZWS4yaG+O0eR37SjJ8EMc="

[icedos.applications.claude-code.users.ice.reviewMcp]
allowedRoots = ["~/.code/icedos"]

# Claude-only MCP servers. Kept off the shared programs.mcp.servers registry
# (configs/mcp.toml) on purpose — that registry is client-agnostic and would hand
# these to opencode and prime-agent too. claude-icedos sets
# `enableMcpIntegration = true`, so claude-code sees the registry *plus* these,
# with these winning on a name clash.
[home-manager.users.ice.programs.claude-code.mcpServers.opencart]
command = "opencart-mcp"
args = []
env = { OPENCART_SSH_HOST = "ddev" }

[home-manager.users.ice.programs.claude-code.mcpServers.perfex-crm]
command = "nix-shell"
args = ["-p", "nodejs", "--run", "node /home/ice/.code/dtek/mcp/perfex-crm-mcp/dist/index.js"]

[home-manager.users.ice.programs.claude-code.mcpServers.ddev]
command = "nix-shell"
args = ["-p", "nodejs", "--run", "npx -y ddev-mcp"]

# Moved out of configs/mcp.toml so only claude-code gets it (opencode and
# prime-agent read the shared programs.mcp.servers registry).
[home-manager.users.ice.programs.claude-code.mcpServers.pagespeed-insights]
command = "nix-shell"
args = [
  "-p",
  "nodejs",
  "--run",
  "export GOOGLE_API_KEY=$(cat $HOME/.config/secrets/google-api-key); npx -y pagespeed-insights-mcp",
]

[home-manager.users.ice.programs.claude-code.skills]
memory-first = """
---
name: memory-first
description: Use ALWAYS — persist all knowledge to Basic Memory MCP before and after every task. Never rely on context window alone.
---

# Memory-First Agent Behavior

## Before Starting Any Work

1. `basic-memory_search_notes(query="topic")` — check if you already know this
2. `basic-memory_recent_activity(timeframe="3d")` — see what recently changed
3. `basic-memory_build_context(url="memory://project/notes")` — load relevant context

## After Finishing Work

Always save outcomes:
```
basic-memory_write_note(
  title="Topic Title",
  content="...",
  directory="projects/relevant-project"
)
```

Use `basic-memory_edit_note` to update existing notes instead of creating duplicates.

## When to Save

Save a note after any of these:
- Decisions made (architecture, tooling, design tradeoffs)
- Bugs found and their root causes
- User preferences and project conventions
- Configuration changes and their rationale
- Anything that took >2 tool calls to figure out

## Save Structure

```markdown
# Title

## Context
Background

## Observations
- [decision] Use X because Y #tag
- [technique] How to do Z #tag

## Relations
- relates_to [[Related Topic]]
```

## Tool Usage Priority (never skip)

1. **Basic Memory** — check and save knowledge first
2. **MCP tools** — use domain-specific MCPs before generic tools
3. **Skills** — load via `skill` tool if task matches
4. **Search tools** — search before acting, don't assume
5. **File tools** — Read/Grep/Glob only when MCPs can't help
6. **Bash** — absolute last resort

## Key Rule

**NEVER rely on your own context window as the sole memory.** Always persist to Basic Memory so knowledge survives across sessions.
"""

icedos-mcp = """
---
name: icedos-mcp
description: Use ALWAYS when working on IceDOS — prefer mcp__icedos__* and mcp__nixos__* tools over manual file reads, grep, or web searches for IceDOS/NixOS questions.
---

# IceDOS MCP-First Behavior

## Mandatory Tool Order for IceDOS Work

1. **IceDOS MCP** (`mcp__icedos__*`) — config, options, modules, repo source, system
2. **NixOS MCP** (`mcp__nixos__*`) — nixpkgs packages, NixOS/home-manager options
3. **Basic Memory** — check/save knowledge
4. **Search tools** — `websearch` only when MCPs can't answer
5. **File tools** — `Read`/`Grep`/`Glob` only for non-IceDOS files
6. **Bash** — absolute last resort

## What Each MCP Covers

### IceDOS MCP
- **Config** — `get_config`, `get_config_value`, `set_config_value`, `delete_config_value`, `list_repositories`, `enable_module`, `disable_module`. Never hand-edit `config.toml`.
- **Options** — `search_options`, `get_option` for `icedos.*` options.
- **Modules** — `list_modules`, `search_modules`, `get_module`, `module_graph`.
- **Repo source** — `list_repo_tree` + `read_repo_file` for any icedos repo (local or online). Use instead of manual file reads.
- **System** — `doctor`, `rebuild`, `rollback`, `get_generations_tool`, `diff_generations`, `list_inputs`, `list_packages`, `run_package`.

### NixOS MCP
- Non-`icedos.*` options (nixpkgs, NixOS, home-manager).
- Package search, info, version history.
- Flake inputs, binary cache, NixOS wiki.

## When NOT to Use MCPs

- Editing a file in place (use `Edit` tool)
- Reading non-IceDOS files (use `Read` tool)
- Git operations (use `Bash`)

## Key Rule

**The MCPs are the source of truth.** Never guess, never hand-parse TOML, never grep for option names — ask the MCP.
"""

# https://github.com/cursor/plugins/blob/main/pstack/skills/unslop/SKILL.md
# `disable-model-invocation: true` dropped from the upstream frontmatter on
# purpose: this should run on every piece of prose, so the model has to be able
# to pick it up itself. Still invocable explicitly with /unslop.
unslop = """
---
name: unslop
description: Use ALWAYS when writing or editing any prose: docs, comments, commit messages, issues, PRs, chat replies. Cut AI tells and add human voice.
---

# Unslop

Edit text to remove AI patterns and add human voice.

## Process

1. Scan for the patterns below.
2. Rewrite. Preserve meaning, match intended tone.
3. Add soul (see next section).
4. Self-audit: "What makes this obviously AI generated?" Fix remaining tells.

## Adding soul

Removing patterns is half the job. Sterile, voiceless writing is just as obvious.

- **Have opinions.** React to facts instead of neutrally listing pros and cons.
- **Vary rhythm.** Short sentences. Then longer ones that take their time. Mix it up.
- **Acknowledge complexity.** "Impressive but also kind of unsettling" beats "impressive."
- **Use "I" when it fits.** First person isn't unprofessional.
- **Let some mess in.** Perfect structure looks machine-made.
- **Be specific.** Not "this is concerning" but "there's something unsettling about agents churning away at 3am."

## Patterns to detect and fix

### Content

1. **Puffery.** "pivotal moment", "testament to", "evolving landscape", "setting the stage for", "indelible mark", "deeply rooted". Cut puffery, state what happened.
2. **Name-dropping.** Listing media outlets without context. Pick one, say what was said.
3. **Superficial -ing phrases.** "highlighting...", "ensuring...", "reflecting...", "showcasing...", "fostering...". Delete or expand with real sources.
4. **Promotional language.** "nestled", "vibrant", "breathtaking", "groundbreaking", "renowned", "stunning", "must-visit". Use neutral descriptions.
5. **Vague attributions.** "Experts believe", "Industry reports suggest", "Some critics argue". Name the source or delete.
6. **Formulaic challenges.** "Despite challenges... continues to thrive." Replace with specific facts.

### Language

7. **AI vocabulary.** Additionally, crucial, delve, enduring, enhance, fostering, garner, interplay, intricate, landscape (abstract), pivotal, showcase, tapestry (abstract), testament, underscore, vibrant. Replace with plain words.
8. **Fancy ways to say "is".** "serves as", "stands as", "boasts", "features". Just say "is" or "has".
9. **"Not just X, but Y."** State the point directly instead.
10. **Rule of three.** Forcing ideas into groups of three. Use the natural number.
11. **Synonym cycling.** Protagonist, main character, central figure, hero all in one paragraph. Pick one, repeat it.
12. **False ranges.** "from X to Y" where X and Y aren't on a meaningful scale. List topics directly.

### Style

13. **Em dash overuse.** Avoid em dashes entirely. Use periods or commas only (no parentheses, no en dashes, no hyphen-as-dash substitutes). Em dashes are an AI tell, and reaching for parentheses instead just trades one tell for another. If a thought needs separation, end the sentence or use a comma.
14. **Colon overuse.** Colons are fine before a list or example. Not as mid-sentence connectors. "If you're coming from traditional automation: instead of registering event handlers, you describe conditions" adds nothing with the colon. Rewrite to let the point stand on its own without comparison framing. "Describing when the scheduler should fire works best as plain English." Same meaning, no crutch punctuation.
15. **Boldface overuse.** Don't bold every proper noun or acronym.
16. **Inline-header lists.** The tell is a bold label and colon that restates the line: "**Performance:** Performance improved...". Convert those to prose. A bold lead-in that ends in a period, names the item, and is followed by genuinely new detail ("**Schema in TypeScript.** Tables live in one file.") is fine, not a tell.
17. **Title case headings.** Use sentence case.
18. **Decorative emojis.** Remove from headings and bullets.
19. **Curly quotes.** Replace with straight quotes.

### Communication artifacts

20. **Chatbot phrases.** "I hope this helps!", "Let me know if...", "Of course!", "Certainly!", "Found the smoking gun!" Remove.
21. **Cutoff disclaimers.** "While specific details are limited..." Find sources or remove.
22. **Sycophantic tone.** "Great question! You're absolutely right!" Respond directly.

### Filler

23. **Filler phrases.** "In order to" becomes "To". "Due to the fact that" becomes "Because". "It is important to note that" gets deleted.
24. **Excessive hedging.** "could potentially possibly be argued that it might" becomes "may".
25. **Generic conclusions.** "The future looks bright." State specific plans or facts.

### Jargon

26. **Abstract metaphor nouns.** Substrate, wedge, vector, locus, vantage, nexus, primitive (as noun), harness (as metaphor), surface (as in "API surface"), bedrock, scaffolding (as metaphor), modality, paradigm, gold-plating, ratchet (as metaphor), evacuate (for moving code), endgame, north star, flywheel. These read as technical but usually have a plainer concrete word. "Substrate" becomes "base". "Wedge in" becomes "add". "Vector" becomes "way" or "method". "Gold-plating" becomes "more than the job needs". "Ratchet" becomes the mechanism's real name or "a limit that only tightens". "Evacuate" becomes "move out". "Endgame" becomes "the last phase". Pick the concrete word.

### Plain speech

27. **Say what it does, not how it feels.** "the database stays close at hand", "SQL you can read", "types that follow your schema" name a feeling. The fix names the mechanism or a number: "`.toSQL()` returns the exact string sent to the database", "a column rename fails the build". Ask what the sentence tells the reader to do or know, then write that. If you can't restate it as a concrete instruction, fact, or number, cut it. One more check: if the sentence could appear unchanged in another project's docs, it says nothing about this one. Cut it.
28. **Shorten or split dense sentences.** If the reader has to backtrack to parse a sentence, break it in two or drop clauses. One idea per sentence.
29. **Active voice.** Prefer it. Catch "is/are/was/were + past participle" and name the actor: "queries are validated" becomes "the compiler validates queries", "the file is parsed by the loader" becomes "the loader parses the file". Passive is fine only when the actor is unknown or genuinely doesn't matter.
30. **Cut adverbs, or use a stronger verb.** "runs quickly" becomes "is fast" or the number. "significantly improves" becomes the measured delta. An adverb propping up a weak verb means the verb is wrong.
31. **Prefer the plain word.** "utilize" becomes "use", "leverage" becomes "use", "facilitate" becomes "help", "numerous" becomes "many", "in the event that" becomes "if". The fancier synonym is rarely clearer.
"""
