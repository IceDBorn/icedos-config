[icedos.applications.opencode.agentMemory]
users = ["ice"]

[icedos.applications.opencode.extraSettings.mcp.context7]
type = "local"
enabled = true
command = ["nix-shell", "-p", "nodejs", "--run", "npx -y @upstash/context7-mcp@latest"]

[icedos.applications.opencode.extraSettings.mcp.nixos]
type = "local"
enabled = true
command = ["nix-shell", "-p", "uv", "--run", "uvx mcp-nixos"]

[icedos.applications.opencode.extraSettings.mcp.icedos]
type = "local"
enabled = true
command = ["icedos", "mcp", "serve"]

[icedos.applications.opencode.extraSettings.mcp.basic-memory]
type = "local"
enabled = true
command = [
  "nix-shell",
  "-p",
  "uv",
  "python313",
  "stdenv.cc.cc.lib",
  "gcc",
  "--run",
  """
    export BASIC_MEMORY_CONFIG_DIR="$HOME/.config/basic-memory"
    export BASIC_MEMORY_HOME="$HOME/.local/share/basic-memory"
    export LD_LIBRARY_PATH=$(dirname $(gcc -print-file-name=libstdc++.so.6)):$LD_LIBRARY_PATH

    uvx --python 3.13 basic-memory mcp
  """
]

[icedos.applications.opencode.extraSettings.mcp.chrome-devtools]
type = "local"
enabled = true
command = ["nix-shell", "-p", "nodejs", "--run", "npx -y chrome-devtools-mcp@latest --executable-path=/run/current-system/sw/bin/helium --isolated=true --no-usage-statistics"]

[icedos.applications.opencode.extraSettings.mcp.claude-review]
type = "local"
enabled = true
command = ["icedos", "claude", "mcp"]

[icedos.applications.opencode.skills]
memory-first = """
---
name: memory-first
description: Use ALWAYS — persist all knowledge to Basic Memory MCP before and after every task. Never rely on context window alone.
---

# Memory-First Agent Behavior

## Before Starting Any Work

1. `basic-memory_search_notes(query="topic")` — check if you already know this
2. `basic-memory_recent_activity(timeframe="3d")` — see what recently changed
3. `basic-memory_build_context(url="memory://project/notes")` — load relevant context

## After Finishing Work

Always save outcomes:
```
basic-memory_write_note(
  title="Topic Title",
  content="...",
  directory="projects/relevant-project"
)
```

Use `basic-memory_edit_note` to update existing notes instead of creating duplicates.

## When to Save

Save a note after any of these:
- Decisions made (architecture, tooling, design tradeoffs)
- Bugs found and their root causes
- User preferences and project conventions
- Configuration changes and their rationale
- Anything that took >2 tool calls to figure out

## Save Structure

```markdown
# Title

## Context
Background

## Observations
- [decision] Use X because Y #tag
- [technique] How to do Z #tag

## Relations
- relates_to [[Related Topic]]
```

## Tool Usage Priority (never skip)

1. **Basic Memory** — check and save knowledge first
2. **MCP tools** — use domain-specific MCPs before generic tools
3. **Skills** — load via `skill` tool if task matches
4. **Search tools** — search before acting, don't assume
5. **File tools** — Read/Grep/Glob only when MCPs can't help
6. **Bash** — absolute last resort

## Key Rule

**NEVER rely on your own context window as the sole memory.** Always persist to Basic Memory so knowledge survives across sessions.
"""

icedos-mcp = """
---
name: icedos-mcp
description: Use ALWAYS when working on IceDOS — prefer mcp__icedos__* and mcp__nixos__* tools over manual file reads, grep, or web searches for IceDOS/NixOS questions.
---

# IceDOS MCP-First Behavior

## Mandatory Tool Order for IceDOS Work

1. **IceDOS MCP** (`mcp__icedos__*`) — config, options, modules, repo source, system
2. **NixOS MCP** (`mcp__nixos__*`) — nixpkgs packages, NixOS/home-manager options
3. **Basic Memory** — check/save knowledge
4. **Search tools** — `websearch` only when MCPs can't answer
5. **File tools** — `Read`/`Grep`/`Glob` only for non-IceDOS files
6. **Bash** — absolute last resort

## What Each MCP Covers

### IceDOS MCP
- **Config** — `get_config`, `get_config_value`, `set_config_value`, `delete_config_value`, `list_repositories`, `enable_module`, `disable_module`. Never hand-edit `config.toml`.
- **Options** — `search_options`, `get_option` for `icedos.*` options.
- **Modules** — `list_modules`, `search_modules`, `get_module`, `module_graph`.
- **Repo source** — `list_repo_tree` + `read_repo_file` for any icedos repo (local or online). Use instead of manual file reads.
- **System** — `doctor`, `rebuild`, `rollback`, `get_generations_tool`, `diff_generations`, `list_inputs`, `list_packages`, `run_package`.

### NixOS MCP
- Non-`icedos.*` options (nixpkgs, NixOS, home-manager).
- Package search, info, version history.
- Flake inputs, binary cache, NixOS wiki.

## When NOT to Use MCPs

- Editing a file in place (use `Edit` tool)
- Reading non-IceDOS files (use `Read` tool)
- Git operations (use `Bash`)

## Key Rule

**The MCPs are the source of truth.** Never guess, never hand-parse TOML, never grep for option names — ask the MCP.
"""

claude-consult = """
---
name: claude-consult
description: Use when you have a plan to check, are stuck, want a design opinion, or have finished a change — consult Claude via mcp__claude-review__* for plan review, diagnosis, review, and verification. Claude reads and runs, never edits.
---

# Consulting Claude

You implement, test, and fix. Claude is a second pair of eyes with judgement you do not
have — it cannot edit this repository, so nothing it says takes the work out of your
hands. Every call spends from a metered subscription window, so call it at the moments
below and not on every iteration.

Always pass `cwd` as the absolute repo path. Always pass the `session_id` from the
previous reply when following up — it keeps the context and costs far less than starting
over.

## Which tool

| Situation | Tool |
|---|---|
| You have a plan and have not written code yet | `claude_review_plan` |
| Stuck on a failure you cannot explain; a test that will not pass; a service that will not start | `claude_help` |
| Need an explanation of existing code, or a design opinion between two approaches | `claude_ask` |
| You believe the change is finished | `claude_review` |
| Final gate before declaring it done | `claude_verify` |

### claude_review_plan

Pass `plan` (the steps as you would execute them — name the files you will touch) and
`goal` (what the change is for, if the plan alone does not say). Optional `focus` for the
part you are least sure about.

Returns `verdict` (`done` or `changes_requested`), `findings[]` — each with the `step` it
applies to and the `file` it is about — plus `gaps[]` (work you left out) and `risks[]`.

Call it once the plan exists and before you write code. It is the cheapest call that can
save a whole implementation cycle, because Claude checks your premises against the actual
repository: whether the file you named is there, whether the helper you plan to write
already exists. Fix every `high` and `medium` finding, then re-call with the `session_id`
if the revision was substantial.

Do not call it on a plan you have already started implementing — at that point it is
`claude_review` you want.

### claude_help

Pass `problem` (what happens, what you expected, the exact error) and `tried` (what you
already attempted and what each attempt did). `tried` matters — without it Claude repeats
your dead ends.

Returns `root_cause`, `confidence`, ordered `steps[]`, and `evidence[]`. Treat
`confidence: "low"` as a hypothesis to test, not an answer to apply.

Call this **before** grinding through a fourth or fifth attempt at the same failure. That
is the moment it is worth the tokens.

### claude_ask

Pass `question`. Cheapest of the five, read-only. Good for "what does this actually do",
"where is X handled", "does this codebase already have a helper for Y". Not for failures
that need reproducing — that is `claude_help`.

### claude_review

Pass the repo; optionally `focus` to point at what you are unsure of. Returns `verdict`
(`done` or `changes_requested`), `findings[]`, `tips[]`.

Fix every `high` and `medium` finding, then call again **with the returned `session_id`**.
Repeat until `verdict` is `done`. `tips` are non-blocking — apply them if they are cheap.

Do not call it on work in progress. It is a verdict on finished work.

### claude_verify

Pass `task` — what the change is supposed to do, in your own words. That sentence is what
gets verified, so make it concrete and falsifiable.

Slowest and most expensive. Run it after `claude_review` returns `done`, not before.
Returns `checks[]` — each with the command run and `pass`/`fail`/`inconclusive` plus
evidence. An `inconclusive` check is not a pass: read `detail` and either make it runnable
or accept the change is unverified.

## Reading the reply

- `permission_denials` — Claude tried a command the allowlist refused. If it blocked real
  verification, say so in your response to the user; the allowlist is `bashAllow` in the
  module config and only they can widen it.
- `diff_truncated: true` — the diff exceeded the byte cap and Claude was told so. Its
  verdict covers only what it could reconstruct. Split the change and re-run.
- `unparsed: true` — the reply did not match the schema. Advisory only; do not branch on
  it. `raw_reply` has the text.

## Do not

- Do not ask Claude to edit, commit, or push. It has no write access to the repo by
  design, and asking wastes a call.
- Do not paste secrets, tokens, or `.env` contents into `problem`, `focus`, or `task`.
- Do not loop: if two consecutive `claude_review` rounds return the same finding, you have
  not fixed it — change approach rather than calling a third time.
"""

[icedos.applications.opencode.extraSettings.experimental]
mcp_timeout = 3600000
