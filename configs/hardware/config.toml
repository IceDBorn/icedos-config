[[icedos.repositories]]
url = "github:icedos/hardware"
# overrideUrl = "path:/home/ice/Projects/icedos/hardware"
modules = [
  "bluetooth",
  "disable-ipv6",
  "pipewire",
  "ryzen",
  "samba",
  "uinput",
  "upower",
  "wake-on-lan",
]

[icedos.hardware]
swapDevices = ["/swap/swapfile"]

[icedos.hardware.bluetooth]
controllerMode = "dual"

[icedos.system.bootloaders.systemd-boot]
mountPoint = "/boot"

[icedos.hardware.network]
firewall = false

[[icedos.hardware.network.samba.shares]]
forceUser = "ice"
guestOk = true
name = "Nvidia Shield Videos"
path = "/mnt/games-hdd/videos/shield"
readOnly = true

[icedos.hardware.network.wake-on-lan]
interfaces = ["enp9s0"]

[icedos.hardware.pipewire.echo-cancellation]
enable = true

[icedos.hardware.pipewire.noise-cancellation]
enable = true
