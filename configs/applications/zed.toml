[[icedos.repositories]]
url = "github:icedos/apps"
modules = ["zed"]

[icedos.applications.zed]
vim = true

[icedos.applications.zed.agent-bridge]
enable = true

[icedos.applications.zed.copy-selection-location]
enable = true

[icedos.applications.zed.font]
size = 12

[icedos.applications.zed.lazygit]
enable = true

[icedos.applications.zed.lsp.taplo.settings.formatter]
alignComments = false
reorderKeys = false
