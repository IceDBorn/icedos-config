local-images = """
/** Persistent local-vision rule, appended to the system prompt each turn. */

import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";

const RULE = `
IMAGES (always):
- Read, describe and analyze images (screenshots, photos, diagrams, scans) with the local model "llamacpp/Qwen3.8-27B-GSQ-RCO-IQ3_XXS+MTP". It accepts image input.
- Do not search for it with rlm.find_models(). Spawn a subagent on it directly from the Python kernel, using the image's absolute path:
  child = await rlm.spawn("Run: print(await attach_image('/abs/path.png')). Then <the user's question about the image>. Reply with the full answer.", name="local-vision", model="llamacpp/Qwen3.8-27B-GSQ-RCO-IQ3_XXS+MTP")
  result = (await rlm.collect(child, timeout_ms=600000))[0]
  print(result.status, result.error, result.answer_preview)
- The first call can take about a minute while llama-server loads the model. If status is not "done", collect again instead of spawning a second child.
- Relay the answer, then remove the child with: await rlm.delete_subagent(child)
- Do not send images to cloud providers unless the local model is unavailable under the GPU rule, or the user asks for a cloud model.`;

// Append the rule to the chained system prompt before each turn.
export default function localImages(pi: ExtensionAPI) {
	pi.on("before_agent_start", (event) => {
		return {
			systemPrompt: `${event.systemPrompt}

${RULE}`,
		};
	});
}
"""

local-gpu-guard = """
/** Persistent GPU-contention rule for the local model, appended to the system prompt each turn. */

import type { ExtensionAPI } from "@earendil-works/pi-coding-agent";

const RULE = `
LOCAL MODEL GPU CHECK (always):
- Use the local llamacpp model only when the GPU is free. Check right before every local model call, including subagents.
- The card number changes between boots and machines, so never hardcode it. List AMD cards with:
  for d in /sys/class/drm/card[0-9]*/device; do [ -r $d/gpu_busy_percent ] && echo "$d busy=$(cat $d/gpu_busy_percent) used=$(cat $d/mem_info_vram_used) total=$(cat $d/mem_info_vram_total)"; done; pgrep -x llama-server
- Judge the card with the largest VRAM total. If none is listed, use: nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total --format=csv
- The GPU is in use if busy is above 30%, or if llama-server is not running and VRAM used is above 4 GiB (4294967296 bytes).
- If the GPU is in use, do not start or call the local model. Use a cloud model instead and tell the user why.`;

// Append the rule to the chained system prompt before each turn.
export default function localGpuGuard(pi: ExtensionAPI) {
	pi.on("before_agent_start", (event) => {
		return {
			systemPrompt: `${event.systemPrompt}

${RULE}`,
		};
	});
}
"""

[icedos.applications.prime-agent.skills.extraBuiltin]
free-review = '''
---
name: free-review
description: Review your changes with the code review skill in a review-until-clean loop, using only free models as subagents (opencode and openrouter free models, the local llamacpp model, and the free-plan quotas of mistral, ollama and cloudflare-workers-ai). Use when the user asks for a free review or asks to review until no findings remain.
---

# Free review

Read the code review skill, then review your changes with it in its review-until-clean loop, following these rules:

1. Use every provider listed below, and no others.
2. Only the free models of each provider and the local llamacpp model as subagents.
3. Goal is considered complete on no findings.

## Finding the free models

Do not use rlm.find_models() for this. It returns at most 20 matches, has no price field, and its free-text search misses most free models. List them from the shell instead:

```bash
prime-agent model list free 2>&1
```

The search is fuzzy and also returns paid models. Keep only:

- opencode/big-pickle, plus opencode models whose id ends in "-free".
- openrouter models whose id ends in ":free". Skip openrouter/free, which is a router, not a model.
- llamacpp/Qwen3.8-27B-GSQ-RCO-IQ3_XXS+MTP, only when the GPU check passes.

Pass each one to rlm.spawn as model="<provider>/<model id>", exactly as listed.

## Free-plan quota models

These accounts are on free plans with small quotas. Use their models only when every model above is rate limited or failing, and only for the rest of that round. List them with:

```bash
prime-agent model list 2>&1 | awk '$1 == "mistral" || $1 == "ollama" || $1 == "cloudflare-workers-ai"'
```

- mistral: every model is free on the Experiment plan, limited to about 2 requests a minute. Run at most one mistral subagent at a time.
- ollama: the free plan covers only some models and one request at a time. Run at most one ollama subagent at a time.
- cloudflare-workers-ai: 10,000 neurons a day, reset at 00:00 UTC.

If one of these returns a quota, plan or rate-limit error, stop using that provider for the rest of the review.

Create a persistent goal with the goal skill. Its objective must name your round state file and tell you to re-read the code-review skill at the start of every round, as the code review skill requires.
'''
